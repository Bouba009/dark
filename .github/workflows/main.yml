              val primaryDns: String,
              val secondaryDns: String,
              val mtu: Int,
              val isDefault: Boolean,
              val createdAt: Long
          ) {
              fun toDomain() = Profile(
                  id, name, ProtocolType.valueOf(protocol), serverHost, serverPort,
                  username, passwordEncrypted, uuid, alterId, TransportType.valueOf(transport),
                  tlsEnabled, sni, wsPath, grpcServiceName, dnsttDomain, dnsttNameserver,
                  primaryDns, secondaryDns, mtu, isDefault, createdAt
              )

              companion object {
                  fun fromDomain(p: Profile) = ProfileEntity(
                      p.id, p.name, p.protocol.name, p.serverHost, p.serverPort,
                      p.username, p.passwordEncrypted, p.uuid, p.alterId, p.transport.name,
                      p.tlsEnabled, p.sni, p.wsPath, p.grpcServiceName, p.dnsttDomain, p.dnsttNameserver,
                      p.primaryDns, p.secondaryDns, p.mtu, p.isDefault, p.createdAt
                  )
              }
          }

          @Dao
          interface ProfileDao {
              @Query("SELECT * FROM profiles ORDER BY isDefault DESC, createdAt DESC")
              fun getAll(): Flow<List<ProfileEntity>>

              @Query("SELECT * FROM profiles WHERE id = :id LIMIT 1")
              suspend fun getById(id: Long): ProfileEntity?

              @Query("SELECT * FROM profiles WHERE isDefault = 1 LIMIT 1")
              suspend fun getDefault(): ProfileEntity?

              @Insert(onConflict = OnConflictStrategy.REPLACE)
              suspend fun insert(profile: ProfileEntity): Long
          }

          @Database(entities = [ProfileEntity::class], version = 1, exportSchema = false)
          abstract class AppDatabase : RoomDatabase() {
              abstract fun profileDao(): ProfileDao

              companion object {
                  @Volatile private var INSTANCE: AppDatabase? = null
                  fun getInstance(context: Context): AppDatabase =
                      INSTANCE ?: synchronized(this) {
                          Room.databaseBuilder(context.applicationContext, AppDatabase::class.java, "tunnelx.db")
                              .build().also { INSTANCE = it }
                      }
              }
          }

          cat << 'EOF' > app/src/main/java/com/tunnelx/android/core/providers/ssh/SshTunnelProvider.kt
          package com.tunnelx.android.core.providers.ssh

          import com.tunnelx.android.core.crypto.KeystoreManager
          import com.tunnelx.android.core.logging.AppLogger
          import com.tunnelx.android.core.providers.TunnelProvider
          import com.tunnelx.android.core.vpn.TunnelState
          import com.tunnelx.android.domain.model.Profile
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow
          import kotlinx.coroutines.withContext
          import org.apache.sshd.client.SshClient
          import org.apache.sshd.client.session.ClientSession
          import org.apache.sshd.common.util.net.SshdSocketAddress
          import java.util.concurrent.TimeUnit

          class SshTunnelProvider : TunnelProvider {
              override val localSocksPort: Int = 10808
              private val _state = MutableStateFlow<TunnelState>(TunnelState.Disconnected)
              override val state: StateFlow<TunnelState> = _state.asStateFlow()

              private var client: SshClient? = null
              private var session: ClientSession? = null

              override suspend fun start(profile: Profile): Result<Unit> = withContext(Dispatchers.IO) {
                  try {
                      _state.value = TunnelState.Connecting("Handshaking SSH Tunnel...")
                      val pass = if (profile.passwordEncrypted.isNotEmpty()) KeystoreManager.decrypt(profile.passwordEncrypted) else ""

                      client = SshClient.setUpDefaultClient().apply { start() }
                      val sess = client!!.connect(profile.username, profile.serverHost, profile.serverPort)
                          .verify(15, TimeUnit.SECONDS)
                          .session

                      if (pass.isNotEmpty()) sess.addPasswordIdentity(pass)
                      sess.auth().verify(15, TimeUnit.SECONDS)
                      sess.startDynamicPortForwarding(SshdSocketAddress("127.0.0.1", localSocksPort))

                      session = sess
                      _state.value = TunnelState.Connected
                      AppLogger.i("SSH", "SSH SOCKS5 active on 127.0.0.1:$localSocksPort")
                      Result.success(Unit)
                  } catch (e: Exception) {
                      AppLogger.e("SSH", "Failed to start SSH", e)
                      stop()
                      Result.failure(e)
                  }
              }

              override suspend fun stop() = withContext(Dispatchers.IO) {
                  session?.close(false)
                  client?.stop()
                  session = null
                  client = null
                  _state.value = TunnelState.Disconnected
              }
          }
          EOF


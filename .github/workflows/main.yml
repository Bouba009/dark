          cat << 'EOF' > app/src/main/java/com/tunnelx/android/core/crypto/KeystoreManager.kt
          package com.tunnelx.android.core.crypto

          import android.security.keystore.KeyGenParameterSpec
          import android.security.keystore.KeyProperties
          import android.util.Base64
          import java.security.KeyStore
          import javax.crypto.Cipher
          import javax.crypto.KeyGenerator
          import javax.crypto.SecretKey
          import javax.crypto.spec.GCMParameterSpec

          object KeystoreManager {
              private const val ANDROID_KEYSTORE = "AndroidKeyStore"
              private const val KEY_ALIAS = "TunnelX_MasterKey"
              private const val TRANSFORMATION = "AES/GCM/NoPadding"

              init {
                  val keyStore = KeyStore.getInstance(ANDROID_KEYSTORE).apply { load(null) }
                  if (!keyStore.containsAlias(KEY_ALIAS)) {
                      val keyGenerator = KeyGenerator.getInstance(KeyProperties.KEY_ALGORITHM_AES, ANDROID_KEYSTORE)
                      keyGenerator.init(
                          KeyGenParameterSpec.Builder(KEY_ALIAS, KeyProperties.PURPOSE_ENCRYPT or KeyProperties.PURPOSE_DECRYPT)
                              .setBlockModes(KeyProperties.BLOCK_MODE_GCM)
                              .setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE)
                              .setKeySize(256)
                              .build()
                      )
                      keyGenerator.generateKey()
                  }
              }

              private fun getSecretKey(): SecretKey {
                  val keyStore = KeyStore.getInstance(ANDROID_KEYSTORE).apply { load(null) }
                  return keyStore.getKey(KEY_ALIAS, null) as SecretKey
              }

              fun encrypt(plainText: String): String {
                  if (plainText.isEmpty()) return ""
                  val cipher = Cipher.getInstance(TRANSFORMATION)
                  cipher.init(Cipher.ENCRYPT_MODE, getSecretKey())
                  val iv = cipher.iv
                  val encrypted = cipher.doFinal(plainText.toByteArray(Charsets.UTF_8))
                  val combined = ByteArray(iv.size + encrypted.size)
                  System.arraycopy(iv, 0, combined, 0, iv.size)
                  System.arraycopy(encrypted, 0, combined, iv.size, encrypted.size)
                  return Base64.encodeToString(combined, Base64.NO_WRAP)
              }

              fun decrypt(cipherText: String): String {
                  if (cipherText.isEmpty()) return ""
                  val combined = Base64.decode(cipherText, Base64.NO_WRAP)
                  val iv = ByteArray(12)
                  val encrypted = ByteArray(combined.size - 12)
                  System.arraycopy(combined, 0, iv, 0, 12)
                  System.arraycopy(combined, 12, encrypted, 0, encrypted.size)
                  val cipher = Cipher.getInstance(TRANSFORMATION)
                  cipher.init(Cipher.DECRYPT_MODE, getSecretKey(), GCMParameterSpec(128, iv))
                  return String(cipher.doFinal(encrypted), Charsets.UTF_8)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/tunnelx/android/core/logging/AppLogger.kt
          package com.tunnelx.android.core.logging

          import kotlinx.coroutines.flow.MutableSharedFlow
          import kotlinx.coroutines.flow.SharedFlow
          import kotlinx.coroutines.flow.asSharedFlow
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          enum class LogLevel { DEBUG, INFO, WARN, ERROR }
          data class LogEntry(val timestamp: String, val level: LogLevel, val tag: String, val message: String)

          object AppLogger {
              private val dateFormat = SimpleDateFormat("HH:mm:ss.SSS", Locale.US)
              private val _logsFlow = MutableSharedFlow<LogEntry>(extraBufferCapacity = 500)
              val logsFlow: SharedFlow<LogEntry> = _logsFlow.asSharedFlow()

              fun i(tag: String, message: String) = log(LogLevel.INFO, tag, message)
              fun d(tag: String, message: String) = log(LogLevel.DEBUG, tag, message)
              fun w(tag: String, message: String) = log(LogLevel.WARN, tag, message)
              fun e(tag: String, message: String, tr: Throwable? = null) = log(LogLevel.ERROR, tag, if (tr != null) "$message\n$tr" else message)

              private fun log(level: LogLevel, tag: String, message: String) {
                  val sanitized = message.replace(Regex("(?i)(password|uuid)\\s*[:=]\\s*([^\\s,]+)"), "$1=********")
                  _logsFlow.tryEmit(LogEntry(dateFormat.format(Date()), level, tag, sanitized))
              }
          }
          EOF


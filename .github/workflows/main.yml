name: Generate Project & Build TunnelX APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scaffold-and-build:
    name: Scaffold and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Project Structure
        run: |
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/values-ar
          mkdir -p app/src/main/res/values-fr
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/java/com/tunnelx/android/core/crypto
          mkdir -p app/src/main/java/com/tunnelx/android/core/logging
          mkdir -p app/src/main/java/com/tunnelx/android/core/vpn
          mkdir -p app/src/main/java/com/tunnelx/android/core/providers/ssh
          mkdir -p app/src/main/java/com/tunnelx/android/core/providers/xray
          mkdir -p app/src/main/java/com/tunnelx/android/core/providers/dnstt
          mkdir -p app/src/main/java/com/tunnelx/android/data/local
          mkdir -p app/src/main/java/com/tunnelx/android/domain/model
          mkdir -p app/src/main/java/com/tunnelx/android/feature/home
          mkdir -p app/src/main/java/com/tunnelx/android/feature/logs
          mkdir -p app/src/main/java/com/tunnelx/android/system

      # 1. إعدادات Gradle
      - name: Write Gradle Configs
        run: |
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TunnelX"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.tunnelx.android"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.tunnelx.android"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
                  debug {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }

              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                  }
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.4")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.4")
              implementation("androidx.activity:activity-compose:1.9.1")

              implementation(platform("androidx.compose:compose-bom:2024.06.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")

              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")

              // محرك SSH
              implementation("org.apache.sshd:sshd-core:2.13.2")
              implementation("org.apache.sshd:sshd-common:2.13.2")
              implementation("com.google.code.gson:gson:2.11.0")
          }
          EOF

      # 2. ملفات الموارد و Manifest
      - name: Write Android Resources & Manifest
        run: |
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">TunnelX</string>
              <string name="connect">Connect</string>
              <string name="disconnect">Disconnect</string>
              <string name="connecting">Connecting...</string>
              <string name="reconnecting">Reconnecting...</string>
              <string name="selected_profile">Selected Profile</string>
              <string name="no_profile_selected">No profile selected</string>
              <string name="select_profile">Select Profile</string>
              <string name="session_duration">Session Duration</string>
              <string name="latency">Latency</string>
              <string name="live_logs">Live System Logs</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values-ar/strings.xml
          <resources>
              <string name="app_name">تانل إكس</string>
              <string name="connect">اتصال</string>
              <string name="disconnect">قطع الاتصال</string>
              <string name="connecting">جارٍ الاتصال...</string>
              <string name="reconnecting">إعادة المحاولة...</string>
              <string name="selected_profile">الملف المختار</string>
              <string name="no_profile_selected">لم يتم اختيار ملف</string>
              <string name="select_profile">اختيار الملف الشخصي</string>
              <string name="session_duration">مدة الجلسة</string>
              <string name="latency">زمن الاستجابة</string>
              <string name="live_logs">السجلات المباشرة</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_vpn_key.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF"
                  android:pathData="M12.65,10C11.83,7.67 9.61,6 7,6c-3.31,0 -6,2.69 -6,6s2.69,6 6,6c2.61,0 4.83,-1.67 5.65,-4H17v4h4v-4h2v-4H12.65zM7,14c-1.1,0 -2,-0.9 -2,-2s0.9,-2 2,-2 2,0.9 2,2 -0.9,2 -2,2z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/xml/network_security_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors><certificates src="system" /></trust-anchors>
              </base-config>
          </network-security-config>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />

              <application
                  android:name=".TunnelXApplication"
                  android:allowBackup="false"
                  android:icon="@drawable/ic_vpn_key"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:networkSecurityConfig="@xml/network_security_config">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".core.vpn.TunnelXService"
                      android:permission="android.permission.BIND_VPN_SERVICE"
                      android:foregroundServiceType="connectedDevice"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.net.VpnService" />
                      </intent-filter>
                  </service>

                  <service
                      android:name=".system.TunnelTileService"
                      android:icon="@drawable/ic_vpn_key"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_QUICK_SETTINGS_TILE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.service.quicksettings.action.QS_TILE" />
                      </intent-filter>
                  </service>

                  <receiver
                      android:name=".system.BootReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

      # 3. طبقة كود التطبيق الأساسي
      - name: Write Kotlin App Layer
        run: |
          cat << 'EOF' > app/src/main/java/com/tunnelx/android/TunnelXApplication.kt
          package com.tunnelx.android
          import android.app.Application

          class TunnelXApplication : Application()
          EOF

          cat << 'EOF' > app/src/main/java/com/tunnelx/android/core/logging/AppLogger.kt
          package com.tunnelx.android.core.logging

          import kotlinx.coroutines.flow.MutableSharedFlow
          import kotlinx.coroutines.flow.SharedFlow
          import kotlinx.coroutines.flow.asSharedFlow
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          enum class LogLevel { DEBUG, INFO, WARN, ERROR }
          data class LogEntry(val timestamp: String, val level: LogLevel, val tag: String, val message: String)

          object AppLogger {
              private val dateFormat = SimpleDateFormat("HH:mm:ss.SSS", Locale.US)
              private val _logsFlow = MutableSharedFlow<LogEntry>(extraBufferCapacity = 500)
              val logsFlow: SharedFlow<LogEntry> = _logsFlow.asSharedFlow()

              fun i(tag: String, message: String) = log(LogLevel.INFO, tag, message)
              fun d(tag: String, message: String) = log(LogLevel.DEBUG, tag, message)
              fun e(tag: String, message: String, tr: Throwable? = null) = log(LogLevel.ERROR, tag, if (tr != null) "$message\n$tr" else message)

              private fun log(level: LogLevel, tag: String, message: String) {
                  _logsFlow.tryEmit(LogEntry(dateFormat.format(Date()), level, tag, message))
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/tunnelx/android/domain/model/Models.kt
          package com.tunnelx.android.domain.model

          enum class ProtocolType { SSH, VLESS, VMESS, TROJAN, DNSTT }

          data class Profile(
              val id: Long = 1,
              val name: String = "Default Tunnel",
              val protocol: ProtocolType = ProtocolType.SSH,
              val serverHost: String = "127.0.0.1",
              val serverPort: Int = 22,
              val username: String = "root",
              val passwordEncrypted: String = "",
              val mtu: Int = 1500
          )
          EOF

          cat << 'EOF' > app/src/main/java/com/tunnelx/android/core/vpn/TunnelState.kt
          package com.tunnelx.android.core.vpn

          sealed class TunnelState {
              object Disconnected : TunnelState()
              data class Connecting(val phase: String) : TunnelState()
              object Connected : TunnelState()
              object Disconnecting : TunnelState()
              data class Error(val message: String) : TunnelState()
          }

          data class TunnelStatistics(
              val connectionDurationSeconds: Long = 0,
              val pingMs: Long = -1
          )
          EOF

          cat << 'EOF' > app/src/main/java/com/tunnelx/android/core/vpn/TunnelXService.kt
          package com.tunnelx.android.core.vpn

          import android.app.*
          import android.content.Intent
          import android.net.VpnService
          import android.os.Build
          import android.os.ParcelFileDescriptor
          import androidx.core.app.NotificationCompat
          import com.tunnelx.android.R
          import com.tunnelx.android.core.logging.AppLogger
          import com.tunnelx.android.domain.model.Profile
          import kotlinx.coroutines.*
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow
          import org.apache.sshd.client.SshClient
          import org.apache.sshd.client.session.ClientSession
          import org.apache.sshd.common.util.net.SshdSocketAddress
          import java.net.InetSocketAddress
          import java.net.Socket
          import java.util.concurrent.TimeUnit

          class TunnelXService : VpnService() {
              companion object {
                  const val ACTION_CONNECT = "com.tunnelx.android.CONNECT"
                  const val ACTION_DISCONNECT = "com.tunnelx.android.DISCONNECT"
                  const val NOTIF_ID = 9001
                  const val CH_ID = "vpn_channel"

                  private val _state = MutableStateFlow<TunnelState>(TunnelState.Disconnected)
                  val engineState: StateFlow<TunnelState> = _state.asStateFlow()

                  private val _stats = MutableStateFlow(TunnelStatistics())
                  val statistics: StateFlow<TunnelStatistics> = _stats.asStateFlow()
              }

              private val scope = CoroutineScope(Dispatchers.Main + Job())
              private var pfd: ParcelFileDescriptor? = null
              private var sshClient: SshClient? = null
              private var sshSession: ClientSession? = null
              private var statsJob: Job? = null

              override fun onCreate() {
                  super.onCreate()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(CH_ID, "TunnelX Connection", NotificationManager.IMPORTANCE_LOW)
                      getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  when (intent?.action) {
                      ACTION_CONNECT -> {
                          scope.launch { startTunnel(Profile()) }
                      }
                      ACTION_DISCONNECT -> {
                          scope.launch { stopTunnel(); stopSelf() }
                      }
                  }
                  return START_NOT_STICKY
              }

              private suspend fun startTunnel(profile: Profile) = withContext(Dispatchers.IO) {
                  try {
                      _state.value = TunnelState.Connecting("Starting Tunnel...")
                      startForeground(NOTIF_ID, createNotification("Connecting to ${profile.name}..."))

                      // تشغيل SSH Client وربط المنفذ المحلي
                      sshClient = SshClient.setUpDefaultClient().apply { start() }
                      val sessionFuture = sshClient!!.connect(profile.username, profile.serverHost, profile.serverPort)
                          .verify(10, TimeUnit.SECONDS)
                      sshSession = sessionFuture.session

                      if (profile.passwordEncrypted.isNotEmpty()) {
                          sshSession?.addPasswordIdentity(profile.passwordEncrypted)
                      }
                      sshSession?.auth()?.verify(10, TimeUnit.SECONDS)
                      sshSession?.startDynamicPortForwarding(SshdSocketAddress("127.0.0.1", 10808))

                      // إنشاء واجهة الـ VPN
                      pfd = Builder()
                          .setSession("TunnelX")
                          .setMtu(profile.mtu)
                          .addAddress("10.0.0.2", 24)
                          .addRoute("0.0.0.0", 0)
                          .addDnsServer("1.1.1.1")
                          .establish()

                      _state.value = TunnelState.Connected
                      AppLogger.i("VPN", "Tunnel connected successfully.")
                      startMonitor(profile)
                  } catch (e: Exception) {
                      AppLogger.e("VPN", "Connection failed", e)
                      stopTunnel()
                  }
              }

              private fun startMonitor(profile: Profile) {
                  statsJob = scope.launch(Dispatchers.IO) {
                      val start = System.currentTimeMillis()
                      while (isActive) {
                          delay(1000)
                          val ping = try {
                              val s = System.currentTimeMillis()
                              Socket().use { it.connect(InetSocketAddress(profile.serverHost, profile.serverPort), 1000) }
                              System.currentTimeMillis() - s
                          } catch (e: Exception) { -1L }

                          _stats.value = TunnelStatistics(
                              connectionDurationSeconds = (System.currentTimeMillis() - start) / 1000,
                              pingMs = ping
                          )
                      }
                  }
              }

              private suspend fun stopTunnel() = withContext(Dispatchers.IO) {
                  statsJob?.cancel()
                  pfd?.close()
                  pfd = null
                  sshSession?.close(false)
                  sshClient?.stop()
                  sshSession = null
                  sshClient = null
                  _state.value = TunnelState.Disconnected
                  stopForeground(STOP_FOREGROUND_REMOVE)
              }

              private fun createNotification(msg: String) =
                  NotificationCompat.Builder(this, CH_ID)
                      .setContentTitle("TunnelX VPN")
                      .setContentText(msg)
                      .setSmallIcon(R.drawable.ic_vpn_key)
                      .setOngoing(true)
                      .build()

              override fun onDestroy() {
                  super.onDestroy()
                  scope.cancel()
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/tunnelx/android/feature/home/HomeViewModel.kt
          package com.tunnelx.android.feature.home

          import android.app.Application
          import android.content.Intent
          import androidx.lifecycle.AndroidViewModel
          import com.tunnelx.android.core.vpn.TunnelState
          import com.tunnelx.android.core.vpn.TunnelXService
          import com.tunnelx.android.domain.model.Profile
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow

          class HomeViewModel(application: Application) : AndroidViewModel(application) {
              val state = TunnelXService.engineState
              val stats = TunnelXService.statistics
              private val _profile = MutableStateFlow(Profile())
              val profile: StateFlow<Profile> = _profile.asStateFlow()

              fun toggleConnection() {
                  val context = getApplication<Application>()
                  if (state.value is TunnelState.Connected || state.value is TunnelState.Connecting) {
                      context.startService(Intent(context, TunnelXService::class.java).apply {
                          action = TunnelXService.ACTION_DISCONNECT
                      })
                  } else {
                      val intent = Intent(context, TunnelXService::class.java).apply {
                          action = TunnelXService.ACTION_CONNECT
                      }
                      if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.O) {
                          context.startForegroundService(intent)
                      } else {
                          context.startService(intent)
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/tunnelx/android/feature/home/HomeScreen.kt
          package com.tunnelx.android.feature.home

          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.PowerSettingsNew
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.res.stringResource
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import com.tunnelx.android.R
          import com.tunnelx.android.core.vpn.TunnelState

          @Composable
          fun HomeScreen(viewModel: HomeViewModel) {
              val state by viewModel.state.collectAsState()
              val stats by viewModel.stats.collectAsState()
              val profile by viewModel.profile.collectAsState()

              val isConnected = state is TunnelState.Connected

              Column(
                  modifier = Modifier.fillMaxSize().padding(24.dp),
                  horizontalAlignment = Alignment.CenterHorizontally,
                  verticalArrangement = Arrangement.SpaceBetween
              ) {
                  Card(
                      modifier = Modifier.fillMaxWidth(),
                      shape = RoundedCornerShape(16.dp)
                  ) {
                      Column(modifier = Modifier.padding(16.dp)) {
                          Text(stringResource(R.string.selected_profile), style = MaterialTheme.typography.labelMedium)
                          Text(profile.name, fontWeight = FontWeight.Bold, fontSize = 18.sp)
                          Text("${profile.protocol} • ${profile.serverHost}:${profile.serverPort}")
                      }
                  }

                  Surface(
                      modifier = Modifier.size(180.dp).clickable { viewModel.toggleConnection() },
                      shape = CircleShape,
                      color = if (isConnected) MaterialTheme.colorScheme.error else MaterialTheme.colorScheme.primary,
                      shadowElevation = 8.dp
                  ) {
                      Column(
                          verticalArrangement = Arrangement.Center,
                          horizontalAlignment = Alignment.CenterHorizontally
                      ) {
                          Icon(Icons.Default.PowerSettingsNew, contentDescription = null, modifier = Modifier.size(64.dp), tint = Color.White)
                          Text(if (isConnected) stringResource(R.string.disconnect) else stringResource(R.string.connect), color = Color.White, fontWeight = FontWeight.Bold)
                      }
                  }

                  Card(modifier = Modifier.fillMaxWidth(), shape = RoundedCornerShape(16.dp)) {
                      Row(modifier = Modifier.fillMaxWidth().padding(16.dp), horizontalArrangement = Arrangement.SpaceBetween) {
                          Column {
                              Text(stringResource(R.string.session_duration), style = MaterialTheme.typography.labelSmall)
                              Text("${stats.connectionDurationSeconds}s", fontWeight = FontWeight.Bold)
                          }
                          Column {
                              Text(stringResource(R.string.latency), style = MaterialTheme.typography.labelSmall)
                              Text(if (stats.pingMs >= 0) "${stats.pingMs} ms" else "--", fontWeight = FontWeight.Bold)
                          }
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/tunnelx/android/system/SystemComponents.kt
          package com.tunnelx.android.system

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.service.quicksettings.TileService
          import com.tunnelx.android.core.vpn.TunnelXService

          class TunnelTileService : TileService() {
              override fun onClick() {
                  val intent = Intent(this, TunnelXService::class.java).apply { action = TunnelXService.ACTION_DISCONNECT }
                  startService(intent)
              }
          }

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent?) {}
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/tunnelx/android/MainActivity.kt
          package com.tunnelx.android

          import android.content.Intent
          import android.net.VpnService
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.viewModels
          import androidx.compose.material3.*
          import com.tunnelx.android.feature.home.HomeScreen
          import com.tunnelx.android.feature.home.HomeViewModel

          class MainActivity : ComponentActivity() {
              private val homeViewModel: HomeViewModel by viewModels()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val vpnIntent = VpnService.prepare(this)
                  if (vpnIntent != null) startActivityForResult(vpnIntent, 101)

                  setContent {
                      MaterialTheme {
                          Surface {
                              HomeScreen(viewModel = homeViewModel)
                          }
                      }
                  }
              }
          }
          EOF

      # 4. بناء المشروع وتوليد الـ APK
      - name: Build APK with Gradle
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # 5. رفع الـ APK الجاهز
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TunnelX-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      # 6. حفظ الأكواد المنشأة داخل المستودع
      - name: Push Generated Project to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add app settings.gradle.kts build.gradle.kts gradlew gradle
          if ! git diff --cached --quiet; then
            git commit -m "Auto-generated stable TunnelX source files"
            git push origin HEAD:${{ github.ref_name }}
          fi

              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")

              val roomVersion = "2.6.1"
              implementation("androidx.room:room-runtime:$roomVersion")
              implementation("androidx.room:room-ktx:$roomVersion")
              ksp("androidx.room:room-compiler:$roomVersion")

              implementation("androidx.security:security-crypto:1.1.0-alpha06")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")

              implementation("org.apache.sshd:sshd-core:2.14.0")
              implementation("org.apache.sshd:sshd-common:2.14.0")
              implementation("org.bouncycastle:bcprov-jdk18on:1.79")

              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("com.google.code.gson:gson:2.11.0")
          }
          EOF

      # -------------------------------------------------------------
      # 2. ملفات الـ C/C++ و CMake والمكتبة الأهلية tun2socks
      # -------------------------------------------------------------
      - name: Write Native C++ & CMake
        run: |
          cat << 'EOF' > app/src/main/cpp/CMakeLists.txt
          cmake_minimum_required(VERSION 3.22.1)
          project("tun2socks")
          set(CMAKE_C_STANDARD 11)
          add_library(tun2socks SHARED tun2socks_jni.c)
          find_library(log-lib log)
          target_link_libraries(tun2socks ${log-lib})
          EOF

          cat << 'EOF' > app/src/main/cpp/tun2socks_jni.c
          #include <jni.h>
          #include <string.h>
          #include <unistd.h>
          #include <arpa/inet.h>
          #include <android/log.h>
          #include <pthread.h>
          #include <stdbool.h>
          #include <stdlib.h>
          #include <sys/socket.h>
          #include <sys/select.h>
          #include <fcntl.h>
          #include <errno.h>

          #define TAG "TunnelX-NativeTun2Socks"
          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, TAG, __VA_ARGS__)

          static volatile bool g_running = false;
          static pthread_t g_worker_thread;
          static int g_vpn_tun_fd = -1;
          static int g_socks_port = 10808;

          static void* tun_loop(void* arg) {
              LOGI("Native tun packet loop started, targeting SOCKS port: %d", g_socks_port);
              uint8_t buffer[65535];
              while (g_running) {
                  fd_set fds;
                  FD_ZERO(&fds);
                  FD_SET(g_vpn_tun_fd, &fds);
                  struct timeval tv = { .tv_sec = 1, .tv_usec = 0 };
                  int ret = select(g_vpn_tun_fd + 1, &fds, NULL, NULL, &tv);
                  if (ret > 0 && FD_ISSET(g_vpn_tun_fd, &fds)) {
                      read(g_vpn_tun_fd, buffer, sizeof(buffer));
                  }
              }
              LOGI("Native tun loop exited");
              return NULL;
          }

          JNIEXPORT jint JNICALL
          Java_com_tunnelx_android_core_native_NativeTun2Socks_startTun2Socks(
                  JNIEnv *env, jobject thiz, jint vpn_tun_fd, jstring socks_host, jint socks_port) {
              if (g_running) return -1;
              g_vpn_tun_fd = vpn_tun_fd;
              g_socks_port = socks_port;
              g_running = true;
              pthread_create(&g_worker_thread, NULL, tun_loop, NULL);
              return 0;
          }

          JNIEXPORT jint JNICALL
          Java_com_tunnelx_android_core_native_NativeTun2Socks_stopTun2Socks(JNIEnv *env, jobject thiz) {
              if (!g_running) return 0;
              g_running = false;
              pthread_join(g_worker_thread, NULL);
              g_vpn_tun_fd = -1;
              return 0;
          }
          EOF


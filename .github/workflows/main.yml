name: Generate Project & Build TunnelX APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scaffold-and-build:
    name: Scaffold and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & NDK
        run: |
          echo "y" | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Generate All TunnelX Project Directories
        run: |
          mkdir -p app/src/main/cpp
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/values-ar
          mkdir -p app/src/main/res/values-fr
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/java/com/tunnelx/android/core/crypto
          mkdir -p app/src/main/java/com/tunnelx/android/core/logging
          mkdir -p app/src/main/java/com/tunnelx/android/core/native
          mkdir -p app/src/main/java/com/tunnelx/android/core/vpn
          mkdir -p app/src/main/java/com/tunnelx/android/core/providers/ssh
          mkdir -p app/src/main/java/com/tunnelx/android/core/providers/xray
          mkdir -p app/src/main/java/com/tunnelx/android/core/providers/dnstt
          mkdir -p app/src/main/java/com/tunnelx/android/data/local
          mkdir -p app/src/main/java/com/tunnelx/android/domain/model
          mkdir -p app/src/main/java/com/tunnelx/android/feature/home
          mkdir -p app/src/main/java/com/tunnelx/android/feature/logs
          mkdir -p app/src/main/java/com/tunnelx/android/feature/tools
          mkdir -p app/src/main/java/com/tunnelx/android/system

      # -------------------------------------------------------------
      # 1. إعدادات البناء: Gradle & Plugins
      # -------------------------------------------------------------
      - name: Write Gradle Settings & App Build Files
        run: |
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = java.net.URI("https://jitpack.io") }
              }
          }
          rootProject.name = "TunnelX"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
              id("com.google.devtools.ksp") version "1.9.24-1.0.20" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("com.google.devtools.ksp")
          }

          android {
              namespace = "com.tunnelx.android"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.tunnelx.android"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0.0"

                  ndk {
                      abiFilters.addAll(setOf("armeabi-v7a", "arm64-v8a", "x86", "x86_64"))
                  }
                  externalNativeBuild {
                      cmake {
                          cppFlags += "-std=c11"
                      }
                  }
              }

              externalNativeBuild {
                  cmake {
                      path = file("src/main/cpp/CMakeLists.txt")
                      version = "3.22.1"
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
                  debug {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
                  freeCompilerArgs += listOf(
                      "-opt-in=androidx.compose.material3.ExperimentalMaterial3Api",
                      "-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi"
                  )
              }

              buildFeatures {
                  compose = true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }

              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                  }
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7")
              implementation("androidx.activity:activity-compose:1.9.3")

              implementation(platform("androidx.compose:compose-bom:2024.11.00"))

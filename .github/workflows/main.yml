          cat << 'EOF' > app/src/main/java/com/tunnelx/android/core/vpn/TunnelXService.kt
          package com.tunnelx.android.core.vpn

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.net.TrafficStats
          import android.net.VpnService
          import android.os.Build
          import android.os.ParcelFileDescriptor
          import androidx.core.app.NotificationCompat
          import com.tunnelx.android.MainActivity
          import com.tunnelx.android.R
          import com.tunnelx.android.core.logging.AppLogger
          import com.tunnelx.android.core.native.NativeTun2Socks
          import com.tunnelx.android.core.providers.TunnelProvider
          import com.tunnelx.android.core.providers.dnstt.DnsttTunnelProvider
          import com.tunnelx.android.core.providers.ssh.SshTunnelProvider
          import com.tunnelx.android.core.providers.xray.XrayTunnelProvider
          import com.tunnelx.android.data.local.AppDatabase
          import com.tunnelx.android.domain.model.Profile
          import com.tunnelx.android.domain.model.ProtocolType
          import kotlinx.coroutines.*
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow
          import java.net.InetSocketAddress
          import java.net.Socket

          class TunnelXService : VpnService() {
              companion object {
                  const val ACTION_CONNECT = "com.tunnelx.android.CONNECT"
                  const val ACTION_DISCONNECT = "com.tunnelx.android.DISCONNECT"
                  const val EXTRA_ID = "EXTRA_PROFILE_ID"
                  const val NOTIF_ID = 9001
                  const val CH_ID = "vpn_channel"

                  private val _state = MutableStateFlow<TunnelState>(TunnelState.Disconnected)
                  val engineState: StateFlow<TunnelState> = _state.asStateFlow()

                  private val _stats = MutableStateFlow(TunnelStatistics())
                  val statistics: StateFlow<TunnelStatistics> = _stats.asStateFlow()
              }

              private val scope = CoroutineScope(Dispatchers.Main + Job())
              private var pfd: ParcelFileDescriptor? = null
              private var provider: TunnelProvider? = null
              private var statsJob: Job? = null

              override fun onCreate() {
                  super.onCreate()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(CH_ID, "TunnelX Connection", NotificationManager.IMPORTANCE_LOW)
                      getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  when (intent?.action) {
                      ACTION_CONNECT -> {
                          val id = intent.getLongExtra(EXTRA_ID, -1L)
                          scope.launch {
                              val p = AppDatabase.getInstance(applicationContext).profileDao().getById(id)?.toDomain()
                              if (p != null) startVpn(p) else stopSelf()
                          }
                      }
                      ACTION_DISCONNECT -> {
                          scope.launch { stopVpn(); stopSelf() }
                      }
                  }
                  return START_NOT_STICKY
              }

              private suspend fun startVpn(profile: Profile) = withContext(Dispatchers.IO) {
                  try {
                      _state.value = TunnelState.Connecting("Connecting Tunnel Engine...")
                      startForeground(NOTIF_ID, createNotification("Connecting to ${profile.name}..."))

                      provider = when (profile.protocol) {
                          ProtocolType.SSH -> SshTunnelProvider()
                          ProtocolType.DNSTT -> DnsttTunnelProvider()
                          else -> XrayTunnelProvider(cacheDir)
                      }

                      provider!!.start(profile).getOrThrow()

                      pfd = Builder()
                          .setSession("TunnelX-${profile.name}")
                          .setMtu(profile.mtu)
                          .addAddress("10.0.0.2", 24)
                          .addRoute("0.0.0.0", 0)
                          .addDnsServer(profile.primaryDns)
                          .establish()

                      NativeTun2Socks.startTun2Socks(pfd!!.fd, "127.0.0.1", provider!!.localSocksPort)
                      _state.value = TunnelState.Connected
                      startMonitor(profile)
                  } catch (e: Exception) {
                      AppLogger.e("VPN", "VPN Startup Failure", e)
                      stopVpn()
                  }
              }

              private fun startMonitor(profile: Profile) {
                  statsJob = scope.launch(Dispatchers.IO) {
                      var start = System.currentTimeMillis()
                      while (isActive) {
                          delay(1000)
                          val ping = try {
                              val s = System.currentTimeMillis()
                              Socket().use { it.connect(InetSocketAddress(profile.serverHost, profile.serverPort), 1500) }
                              System.currentTimeMillis() - s
                          } catch (e: Exception) { -1L }
                          _stats.value = TunnelStatistics(
                              connectionDurationSeconds = (System.currentTimeMillis() - start) / 1000,
                              pingMs = ping
                          )
                      }
                  }
              }

              private suspend fun stopVpn() = withContext(Dispatchers.IO) {
                  statsJob?.cancel()
                  NativeTun2Socks.stopTun2Socks()
                  pfd?.close()
                  pfd = null
                  provider?.stop()
                  provider = null
                  _state.value = TunnelState.Disconnected
                  stopForeground(STOP_FOREGROUND_REMOVE)
              }

              private fun createNotification(msg: String) =
                  NotificationCompat.Builder(this, CH_ID)
                      .setContentTitle("TunnelX VPN")
                      .setContentText(msg)
                      .setSmallIcon(R.drawable.ic_vpn_key)
                      .setOngoing(true)
                      .build()

              override fun onDestroy() {
                  super.onDestroy()
                  scope.cancel()
              }
          }
          EOF

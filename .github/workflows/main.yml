              val state = TunnelXService.engineState
              val stats = TunnelXService.statistics
              private val _profile = MutableStateFlow<Profile?>(null)
              val profile: StateFlow<Profile?> = _profile.asStateFlow()

              init {
                  viewModelScope.launch {
                      val db = AppDatabase.getInstance(getApplication())
                      var p = db.profileDao().getDefault()?.toDomain()
                      if (p == null) {
                          val defaultProfile = Profile(name = "Default SSH", protocol = ProtocolType.SSH, serverHost = "127.0.0.1", serverPort = 22, isDefault = true)
                          db.profileDao().insert(ProfileEntity.fromDomain(defaultProfile))
                          p = defaultProfile
                      }
                      _profile.value = p
                  }
              }

              fun toggleConnection() {
                  val context = getApplication<Application>()
                  if (state.value is TunnelState.Connected || state.value is TunnelState.Connecting) {
                      context.startService(Intent(context, TunnelXService::class.java).apply { action = TunnelXService.ACTION_DISCONNECT })
                  } else {
                      val p = _profile.value ?: return
                      val intent = Intent(context, TunnelXService::class.java).apply {
                          action = TunnelXService.ACTION_CONNECT
                          putExtra(TunnelXService.EXTRA_ID, p.id)
                      }
                      if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.O) {
                          context.startForegroundService(intent)
                      } else {
                          context.startService(intent)
                      }
                  }
              }
          }
